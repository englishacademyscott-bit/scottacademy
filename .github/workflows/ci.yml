name: Qualidade
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: academia
          POSTGRES_DB: academia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academia" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://academia:academia@localhost:5432/academia?schema=public
      AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
